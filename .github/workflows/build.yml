# Rebuilds the site whenever a post or page source changes on main
# (e.g. a new Markdown file added from the GitHub website or the iPad),
# then commits the generated pages so GitHub Pages serves them.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'
      - 'privacy.html'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A insights index.html styles.css sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "Build site from posts"
            git push
          fi
